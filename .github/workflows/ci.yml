# Vérifications automatiques à chaque push et pull request :
# installation reproductible, audit des dépendances, tests du formulaire, build.
# (Le déploiement est assuré par l'intégration Git de Cloudflare Pages.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principe du moindre privilège : lecture seule.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées sur un SHA de commit (immuable), et non sur un tag modifiable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation (lockfile strict)
        run: npm ci

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Contrôle — aucun script ou style inline dans le HTML généré
        run: |
          if grep -rEl '<script(\s[^>]*)?>[^<]|<style|\sstyle="|\son[a-z]+="' dist --include='*.html'; then
            echo "::error::Contenu inline détecté : incompatible avec la CSP stricte."
            exit 1
          fi
